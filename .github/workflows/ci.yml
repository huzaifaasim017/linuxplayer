name: Build and package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev qt6-declarative-dev libmpv-dev libgl1-mesa-dev libqt6svg6 desktop-file-utils appstream qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs qml6-module-qtquick-layouts
      - name: Validate desktop metadata
        run: |
          desktop-file-validate assets/io.github.teamkrope.LinuxPlayer.desktop
          appstreamcli validate --no-net assets/io.github.teamkrope.LinuxPlayer.metainfo.xml
      - name: Test installer selection
        run: bash tests/installer.sh
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Build and inspect Debian package
        shell: bash
        run: |
          set -euo pipefail
          cd build
          cpack -G DEB
          package=$(find . -maxdepth 1 -name 'linuxplayer_*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = "${{ matrix.arch }}"
          dpkg-deb -f "$package" Depends | grep -F 'qml6-module-qtquick-controls'
          dpkg-deb -f "$package" Depends | grep -F 'libmpv2'
          dpkg-deb -f "$package" Depends | grep -F 'libqt6svg6'
          dpkg-deb -f "$package" Depends | grep -F 'qml6-module-qtqml-workerscript'
          mkdir -p ../dist
          cp "$package" "../dist/linuxplayer_${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  validate-newer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ matrix.arch }}
          path: dist/
      - name: Install and launch on newer Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y "./dist/linuxplayer_${{ matrix.arch }}.deb"
          QT_QPA_PLATFORM=offscreen linuxplayer --smoke-test

  # Preserve the repository's required check name. It passes only after the
  # architecture builds and newer-Ubuntu install checks have all succeeded.
  ubuntu-2404:
    needs: validate-newer
    runs-on: ubuntu-24.04
    steps:
      - run: echo "LinuxPlayer build and install matrix passed."
