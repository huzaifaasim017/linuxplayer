name: Build and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-2404:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev qt6-declarative-dev libmpv-dev libgl1-mesa-dev libqt6svg6 desktop-file-utils appstream qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs qml6-module-qtquick-layouts
      - name: Validate desktop metadata
        run: |
          desktop-file-validate assets/io.github.teamkrope.LinuxPlayer.desktop
          appstreamcli validate --no-net assets/io.github.teamkrope.LinuxPlayer.metainfo.xml
      - name: Test installer selection
        run: bash tests/installer.sh
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLINUXPLAYER_UBUNTU_VERSION=24.04
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Build and inspect Debian package
        run: |
          cd build
          cpack -G DEB
          dpkg-deb -I linuxplayer_*.deb
          dpkg-deb -c linuxplayer_*.deb
          dpkg-deb -f linuxplayer_*.deb Depends | grep -F 'qml6-module-qtquick-controls'
          dpkg-deb -f linuxplayer_*.deb Depends | grep -F 'libmpv2'
          dpkg-deb -f linuxplayer_*.deb Depends | grep -F 'libqt6svg6'
          dpkg-deb -f linuxplayer_*.deb Depends | grep -F 'qml6-module-qtqml-workerscript'
