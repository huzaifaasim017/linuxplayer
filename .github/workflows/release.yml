name: Release Ubuntu package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ubuntu-2604-amd64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev qt6-declarative-dev libmpv-dev libgl1-mesa-dev libqt6svg6 desktop-file-utils appstream

      - name: Validate metadata
        run: |
          desktop-file-validate assets/io.github.teamkrope.LinuxPlayer.desktop
          appstreamcli validate --no-net assets/io.github.teamkrope.LinuxPlayer.metainfo.xml

      - name: Build and test
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure

      - name: Package and check installation dependencies
        run: |
          set -euo pipefail
          (cd build-release && cpack -G DEB)
          package=$(find build-release -maxdepth 1 -name 'linuxplayer_*.deb' -print -quit)
          test -n "$package"
          version=$(dpkg-deb -f "$package" Version)
          architecture=$(dpkg-deb -f "$package" Architecture)
          test "$GITHUB_REF_NAME" = "v$version"
          test "$architecture" = amd64
          apt-get -s install "./$package"
          mkdir -p dist
          asset="linuxplayer_${version}_ubuntu26.04_${architecture}.deb"
          cp "$package" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 \
            --verify-tag \
            --prerelease \
            --title "LinuxPlayer ${GITHUB_REF_NAME#v} preview" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
