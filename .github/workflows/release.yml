name: Release Ubuntu packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev qt6-declarative-dev libmpv-dev libgl1-mesa-dev libqt6svg6 desktop-file-utils appstream qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs qml6-module-qtquick-layouts

      - name: Validate metadata
        run: |
          desktop-file-validate assets/io.github.teamkrope.LinuxPlayer.desktop
          appstreamcli validate --no-net assets/io.github.teamkrope.LinuxPlayer.metainfo.xml

      - name: Build and test
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DLINUXPLAYER_UBUNTU_VERSION=${{ matrix.ubuntu }}
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure

      - name: Package and verify installation
        shell: bash
        run: |
          set -euo pipefail
          (cd build-release && cpack -G DEB)
          package=$(find build-release -maxdepth 1 -name 'linuxplayer_*.deb' -print -quit)
          test -n "$package"
          version=$(dpkg-deb -f "$package" Version)
          architecture=$(dpkg-deb -f "$package" Architecture)
          test "$GITHUB_REF_NAME" = "v$version"
          test "$architecture" = amd64
          sudo apt-get install -y "./$package"
          QT_QPA_PLATFORM=offscreen linuxplayer --smoke-test
          mkdir -p dist
          asset="linuxplayer_ubuntu${{ matrix.ubuntu }}_${architecture}.deb"
          cp "$package" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.ubuntu }}-amd64
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ubuntu-*-amd64
          path: dist/
          merge-multiple: true
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 scripts/install.sh \
            --verify-tag \
            --latest \
            --title "LinuxPlayer ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
