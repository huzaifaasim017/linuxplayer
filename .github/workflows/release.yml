name: Release Linux packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev qt6-declarative-dev libmpv-dev libgl1-mesa-dev libqt6svg6 desktop-file-utils appstream qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-dialogs qml6-module-qtquick-layouts

      - name: Validate metadata
        run: |
          desktop-file-validate assets/io.github.teamkrope.LinuxPlayer.desktop
          appstreamcli validate --no-net assets/io.github.teamkrope.LinuxPlayer.metainfo.xml

      - name: Build and test
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure

      - name: Package and verify installation
        shell: bash
        run: |
          set -euo pipefail
          (cd build-release && cpack -G DEB)
          package=$(find build-release -maxdepth 1 -name 'linuxplayer_*.deb' -print -quit)
          test -n "$package"
          test "$(dpkg-deb -f "$package" Version)" = "${GITHUB_REF_NAME#v}"
          test "$(dpkg-deb -f "$package" Architecture)" = "${{ matrix.arch }}"
          sudo apt-get install -y "./$package"
          QT_QPA_PLATFORM=offscreen linuxplayer --smoke-test
          mkdir -p dist
          asset="linuxplayer_${{ matrix.arch }}.deb"
          cp "$package" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  validate-newer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ matrix.arch }}
          path: dist/
      - name: Verify newer Ubuntu installation
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "linuxplayer_${{ matrix.arch }}.deb.sha256")
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              if [ "${{ matrix.arch }}" = amd64 ]; then
                sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
              else
                sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://ports.ubuntu.com/ubuntu-ports|g' "$source"
              fi
            fi
          done
          sudo apt-get update
          sudo apt-get install -y "./dist/linuxplayer_${{ matrix.arch }}.deb"
          QT_QPA_PLATFORM=offscreen linuxplayer --smoke-test

  publish:
    needs: validate-newer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist/
          merge-multiple: true
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 scripts/install.sh \
            --verify-tag \
            --latest \
            --title "LinuxPlayer ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
