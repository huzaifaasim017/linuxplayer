name: Feature request
description: Suggest a change that improves the watching experience
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: A small first version is especially helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas or examples
